# LOCAL development infrastructure. Nothing here is safe for production.
name: hashroll
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hashroll
      POSTGRES_PASSWORD: hashroll
      POSTGRES_DB: hashroll
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports: ["8545:8545"]

volumes:
  pgdata:
